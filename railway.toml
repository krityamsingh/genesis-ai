[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects PORT at runtime; avoid shell-specific default expansion
# that can be passed literally and crash uvicorn parsing.
startCommand = "sh -c 'uvicorn api.main:app --host 0.0.0.0 --port ${PORT}'"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
