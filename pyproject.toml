[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "genesis-ai"
version = "2.1.0"
description = "GENESIS — Modular Self-Learning AI System built on Gemma 4"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", ".venv", "venv", "_archived_sql_files"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RUF"]
ignore  = ["E501", "B008", "RUF012"]
per-file-ignores = { "__init__.py" = ["F401"], "tests/**" = ["S101"] }

[tool.black]
line-length    = 100
target-version = ["py311"]
skip-string-normalization = false

[tool.mypy]
python_version     = "3.11"
warn_return_any    = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["_archived_sql_files", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = "-v --tb=short --cov=. --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
omit = ["tests/*", "_archived_sql_files/*", "*/migrations/*", "notebooks/*"]
