# config/base.yaml — GENESIS base configuration
#
# Fix: port corrected from 8000 → 8080 to match Dockerfile EXPOSE and
# Railway deployment. Having 8000 here while Dockerfile defaults to 8080
# caused silent healthcheck failures on Railway.

app:
  name: "GENESIS"
  version: "1.0.0"
  debug: false

api:
  host: "0.0.0.0"
  port: 8080          # was 8000 — now matches Dockerfile and railway.toml
  prefix: "/api/v1"
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"

engine:
  model: "default"          # default | fast | mini | code
  timeout: 120
  max_retries: 3
  retry_delay: 5

knowledge_graph:
  backend: "auto"           # auto | chromadb | tfidf
  persist_dir: ""           # empty = in-memory

memory:
  max_turns: 20

security:
  jwt_expire_hours: 24
  rate_limit_per_min: 60

logging:
  level: "INFO"
  file: ""                  # empty = stdout only (correct for Railway)

modules:
  # m1 is always enabled — it is the core learning module
  m1: {enabled: true}
  # m2-m6 are disabled by default. Enable individually once you have
  # reviewed the module's capabilities and resource requirements.
  # m2 (web scraper): enable when ingestion pipeline is configured
  m2: {enabled: false}
  # m3 (code analysis): enable for developer-focused deployments
  m3: {enabled: false}
  # m4 (time reconstruction): enable for historical analysis features
  m4: {enabled: false}
  # m5 (intuition engine): enable for cross-module reasoning
  m5: {enabled: false}
  # m6 (reality sim / code synthesizer): enable with caution —
  # executes synthesized code; ensure proper sandboxing before enabling
  m6: {enabled: false}
