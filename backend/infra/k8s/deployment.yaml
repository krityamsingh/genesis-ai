apiVersion: apps/v1
kind: Deployment
metadata:
  name: genesis-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: genesis-api
  template:
    metadata:
      labels:
        app: genesis-api
    spec:
      containers:
        - name: api
          image: genesis-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: genesis-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu:    "250m"
            limits:
              memory: "2Gi"
              cpu:    "1000m"
