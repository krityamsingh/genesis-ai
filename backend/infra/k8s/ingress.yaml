apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: genesis-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - host: genesis.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: genesis-api
                port:
                  number: 80
