apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: genesis-api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containers:
        - image: gcr.io/YOUR_PROJECT/genesis-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: ENV
              value: production
          resources:
            limits:
              memory: "2Gi"
              cpu:    "2"
